        "--replSet",
        "shard2", #название реплики
        "--bind_ip_all",
        "--port",
        "27022"
      ]
    healthcheck:
      # test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      test: ["CMD", "mongosh", "--port", "27022", "--eval", "db.adminCommand('ping')"]
