      - shard21-data:/data/db
    command:
      [
        "--shardsvr", #запуск в режиме шардинга
        "--replSet",
        "shard2", #название реплики
        "--bind_ip_all",
        "--port",
        "27021"
      ]
    healthcheck:
      # test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      test: ["CMD", "mongosh", "--port", "27021", "--eval", "db.adminCommand('ping')"]
