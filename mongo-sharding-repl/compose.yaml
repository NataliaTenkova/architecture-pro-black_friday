services:
  pymongo_api:
    container_name: mongo-sharding-repl
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    networks:
      - mongo-sharding-repl-network
    environment:
      MONGODB_URL: "mongodb://mongos_router:27016"
      MONGODB_DATABASE_NAME: "somedb"
  
  # сервер конфигурации
  configSrv:
    image: mongo:latest
    container_name: configSrv 
    ports:
      - "27017:27017"
    networks:
      - mongo-sharding-repl-network
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",  #запуск в режиме конфигурации
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ] 
    healthcheck:
      # test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # роутер
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    ports:
      - "27016:27016"
    networks:
      - mongo-sharding-repl-network
    command:
      [
        "mongos", #обычная mongo в режиме роутера
        "--configdb", 
        "config_server/configSrv:27017", #передача данных сервера конфигурации
        "--bind_ip_all",
        "--port",
        "27016"
      ]
    healthcheck:
      # test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      test: ["CMD", "mongosh", "--port", "27016", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  #1-й шард 1-я реплика
  shard1_1:
    image: mongo:latest
    container_name: shard1_1
    ports:
      - "27018:27018"
    networks:
      - mongo-sharding-repl-network
    volumes:
      - shard11-data:/data/db
    command:
      [
        "--shardsvr", #запуск в режиме шардинга
        "--replSet",
        "shard1", #название реплики
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      # test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
  
  #1-й шард 2-я реплика
  shard1_2:
    image: mongo:latest
    container_name: shard1_2
    ports:
      - "27019:27019"
    networks:
      - mongo-sharding-repl-network
    volumes:
      - shard12-data:/data/db
    command:
      [
        "--shardsvr", #запуск в режиме шардинга
        "--replSet",
        "shard1", #название реплики
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      # test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
  
  #1-й шард 3-я реплика
  shard1_3:
    image: mongo:latest
    container_name: shard1_3
    ports:
      - "27020:27020"
    networks:
      - mongo-sharding-repl-network
